name: Mod catalog

# El catálogo de #mods y #apps (lib/catalog.mjs): una card por proyecto de projects.json, editada en el lugar
# con la versión, el Minecraft, los loaders y las descargas de Modrinth y CurseForge (vía cfwidget).
# Cada hora alcanza: cfwidget cachea una hora, y la card sólo se edita cuando cambia lo que muestra.
# Va aparte de intake.yml a propósito: una API de tienda caída no ensucia la cadena del intake.
#
# De paso guarda los totales de descargas de cada mod (lib/stats.mjs) en stats/downloads.json de la
# rama orphan `stats`, montada como worktree en stats-branch/. Es la única rama que pushea: main no
# recibe nada. La rama se crea sola en la primera corrida. Un dry run no escribe stats.
# Al lado reescribe stats/modrinth-daily.json, las descargas por día de Modrinth desde sus analytics,
# y stats/revenue-fetched.json, el revenue por mes de Modrinth y de GitHub Sponsors.
#
#   Secrets:   DISCORD_TOKEN          el bot único del server
#              GH_TOKEN               el PAT que comparte con intake.yml: lee el DESCRIPTION_SHORT.txt
#                                     del repo privado de cada mod y, por ser del autor, sus sponsors
#              MODRINTH_ANALYTICS_TOKEN  PAT de Modrinth con Read analytics y Read payouts. Sin él, la
#                                     serie y el revenue de Modrinth no se actualizan (warning) y el
#                                     resto corre igual
#   Variables: <PREFIX>_GH_REPO       el repo del mod

run-name: Mod catalog (${{ inputs.dry_run && 'dry run' || github.event_name }}${{ inputs.prune && ' + prune' || '' }})

on:
  schedule:
    - cron: "41 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Only print what would change"
        type: boolean
        default: false
      prune:
        description: "Delete bot posts in #mods past the last project"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: catalog
  cancel-in-progress: false

jobs:
  catalog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Mount the stats branch
        if: ${{ !inputs.dry_run }}
        run: |
          if git fetch --depth=1 origin stats; then
            git worktree add stats-branch FETCH_HEAD
          else
            git worktree add --orphan -b stats stats-branch
          fi
      - name: Update the cards in #mods
        env:
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
          REPO_VARS: ${{ toJSON(vars) }}
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          MODRINTH_ANALYTICS_TOKEN: ${{ secrets.MODRINTH_ANALYTICS_TOKEN }}
          DRY_RUN: ${{ inputs.dry_run && '--dry-run' || '' }}
          PRUNE: ${{ inputs.prune && '--prune' || '' }}
          STATS: ${{ !inputs.dry_run && '--stats stats-branch/stats/downloads.json' || '' }}
        run: node lib/catalog.mjs $DRY_RUN $PRUNE $STATS
      # También cuando el catálogo salió rojo: los mods que sí se bajaron tienen su fila escrita.
      - name: Push the download snapshot
        if: ${{ !inputs.dry_run && !cancelled() }}
        working-directory: stats-branch
        run: |
          if [ ! -f stats/downloads.json ]; then exit 0; fi
          git add stats/downloads.json
          for f in modrinth-daily.json revenue-fetched.json; do
            if [ -f "stats/$f" ]; then git add "stats/$f"; fi
          done
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(stats): download snapshot [skip ci]"
          git push origin HEAD:stats
