name: Discord → GitHub Issues Intake

on:
  schedule:
    - cron: "*/5 * * * *"   # every 5 minutes
  workflow_dispatch:           # allow manual trigger

jobs:
  intake:
    runs-on: ubuntu-latest
    permissions:
      contents: write          # needed to commit state.json

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # Restore cached state so we don't re-file already-tracked threads
      - name: Restore state cache
        uses: actions/cache@v4
        with:
          path: bot/state.json
          key: discord-intake-state-${{ github.run_id }}
          restore-keys: discord-intake-state-

      - name: Run intake bot
        env:
          DISCORD_TOKEN:          ${{ secrets.DISCORD_TOKEN }}
          DISCORD_GUILD_ID:       ${{ secrets.DISCORD_GUILD_ID }}
          DISCORD_BUG_CHANNEL_ID: ${{ secrets.DISCORD_BUG_CHANNEL_ID }}
          DISCORD_FEATURE_CHANNEL_ID: ${{ secrets.DISCORD_FEATURE_CHANNEL_ID }}
          GITHUB_TOKEN:           ${{ secrets.INTAKE_GITHUB_TOKEN }}
          GITHUB_REPO:            manucruzleiva/cobblemon-ditto-hms
        run: node bot/intake.js
