name: Intake — Picnic

# Poller de Cobblemon Picnic. Es el único que además mantiene reporters.json (el tally por reportero
# que la wiki lee para armar la página de créditos de la comunidad), así que persiste DOS archivos.
# El script (picnic/poll-channels.mjs) no se modificó; sólo se namespacearon los secrets.
#
# Secrets:  PICNIC_DISCORD_TOKEN, PICNIC_GH_TOKEN (PAT con Issues: write)
# Variables: PICNIC_GH_REPO = manucruzleiva/cobblemon-picnic
#            PICNIC_TICKETS_CHANNEL_ID = 1532081390508839083
#
# Unico de los cuatro que NO usa DISCORD_GUILD_ID: poll-channels.mjs lee canales de texto por id,
# no threads de un foro, asi que no necesita el lookup guild-wide.
#
# El Discord paso a UN SOLO hilo de tickets por proyecto: ya no hay canal de features.
#
# Se setea SOLO BUG_CHANNEL_ID. FEATURE_CHANNEL_ID queda deliberadamente vacio: el script filtra
# los canales sin id (`.filter((c) => c.id)`), asi que hace una sola pasada. Apuntar los dos al
# mismo canal duplicaria cada ticket, porque el estado se guarda por `kind` y no por canal — el
# mismo thread entraria como [Bug] y como [Feature] con lastId independientes.
#
# Efecto: todo ticket se etiqueta `bug` + `discord`. El triage a enhancement se hace en el issue.

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: intake-picnic
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Poll channels and file issues
        working-directory: picnic
        env:
          DISCORD_TOKEN: ${{ secrets.PICNIC_DISCORD_TOKEN }}
          MOD_REPO_TOKEN: ${{ secrets.PICNIC_GH_TOKEN }}
          MOD_REPO: ${{ vars.PICNIC_GH_REPO }}
          # Un solo hilo de tickets. FEATURE_CHANNEL_ID NO se setea a proposito (ver cabecera).
          BUG_CHANNEL_ID: ${{ vars.PICNIC_TICKETS_CHANNEL_ID }}
        run: node poll-channels.mjs

      - name: Persist state + reporters
        run: |
          git add picnic/intake-state.json picnic/reporters.json
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git commit -m "chore(picnic): update state + reporters [skip ci]"
            git pull --rebase --autostash
            git push
          fi
