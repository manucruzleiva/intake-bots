name: Intake — Picnic

# Poller de Cobblemon Picnic. Usa el MISMO poll.mjs que los otros tres: hasta 2026-07-31 tenia su
# propio poll-channels.mjs, heredado de cuando el Discord tenia un canal de bugs y otro de features
# y el TIPO del ticket salia del canal en el que se posteaba. Hoy hay un solo hilo de tickets por
# proyecto y el tipo lo dan los tags del foro (Bug / Crash / Idea / Feedback), asi que ese diseño ya
# no aplicaba: todo entraba etiquetado `bug`.
#
# Secrets:   PICNIC_DISCORD_TOKEN, PICNIC_GH_TOKEN (PAT que puede abrir issues en el repo del mod)
# Variables: PICNIC_GH_REPO = manucruzleiva/cobblemon-picnic
#            PICNIC_TICKETS_CHANNEL_ID = 1532081390508839083
#            DISCORD_GUILD_ID  <- COMPARTIDA por los cuatro bots (hay un solo server)
#
# SKIP_BEFORE_ID es el `lastId` que dejo el bot viejo en intake-state.json. Ese estado guardaba una
# marca de agua, no la lista de posts, asi que no se puede convertir a la lista que usa poll.mjs:
# los snowflakes son cronologicos, y todo lo anterior a esa marca ya lo habia importado el. Sin
# esto, la primera corrida volveria a filar los posts archivados del foro.

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

# Namespaceado: si los cuatro bots compartieran grupo se serializarían entre sí sin motivo.
concurrency:
  group: intake-picnic
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Poll Discord and file issues
        working-directory: picnic
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.PICNIC_DISCORD_TOKEN }}
          DISCORD_FORUM_CHANNEL_ID: ${{ vars.PICNIC_TICKETS_CHANNEL_ID }}
          DISCORD_GUILD_ID: ${{ vars.DISCORD_GUILD_ID }}
          GH_TOKEN: ${{ secrets.PICNIC_GH_TOKEN }}
          GH_ISSUES_REPO: ${{ vars.PICNIC_GH_REPO }}
          SKIP_BEFORE_ID: "1516437610648834058"
        run: node poll.mjs

      - name: Persist dedup state and credits
        run: |
          # reporters.json no existe hasta que se fila el primer issue, y `git add` de un path que
          # no existe corta con exit 128. Se agrega lo que haya y se commitea solo si quedo algo.
          for f in picnic/state.json picnic/reporters.json; do
            if [ -f "$f" ]; then git add "$f"; fi
          done
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git commit -m "chore(picnic): update intake state [skip ci]"
            # Los cuatro bots commitean al mismo branch: reintentar sobre lo que haya entrado.
            git pull --rebase --autostash
            git push
          fi
