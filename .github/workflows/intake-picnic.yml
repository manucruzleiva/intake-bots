name: Intake — Picnic

# Poller de Cobblemon Picnic. Es el único que además mantiene reporters.json (el tally por reportero
# que la wiki lee para armar la página de créditos de la comunidad), así que persiste DOS archivos.
# El script (picnic/poll-channels.mjs) no se modificó; sólo se namespacearon los secrets.
#
# Secrets:  PICNIC_DISCORD_TOKEN, PICNIC_MOD_REPO_TOKEN (PAT con Issues: write)
# Variables: PICNIC_MOD_REPO = manucruzleiva/cobblemon-picnic
#            PICNIC_BUG_CHANNEL_ID, PICNIC_FEATURE_CHANNEL_ID

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: intake-picnic
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Poll channels and file issues
        working-directory: picnic
        env:
          DISCORD_TOKEN: ${{ secrets.PICNIC_DISCORD_TOKEN }}
          MOD_REPO_TOKEN: ${{ secrets.PICNIC_MOD_REPO_TOKEN }}
          MOD_REPO: ${{ vars.PICNIC_MOD_REPO }}
          BUG_CHANNEL_ID: ${{ vars.PICNIC_BUG_CHANNEL_ID }}
          FEATURE_CHANNEL_ID: ${{ vars.PICNIC_FEATURE_CHANNEL_ID }}
        run: node poll-channels.mjs

      - name: Persist state + reporters
        run: |
          git add picnic/intake-state.json picnic/reporters.json
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git commit -m "chore(picnic): update state + reporters [skip ci]"
            git pull --rebase --autostash
            git push
          fi
