name: Intake

# Un solo poller (lib/poller.mjs) para todos los proyectos de projects.json. Cada proyecto es una fila
# de la matrix: corre desde su carpeta, así que su state.json y su reporters.json no se mueven.
#
# Secrets y variables van namespaceados por el `prefix` de projects.json:
#   Secrets:   <PREFIX>_DISCORD_TOKEN, <PREFIX>_GH_TOKEN (PAT que puede abrir issues en el repo del mod)
#   Variables: <PREFIX>_GH_REPO, <PREFIX>_TICKETS_CHANNEL_ID
#              DISCORD_GUILD_ID  <- COMPARTIDA (hay un solo server)
#
# DISCORD_GUILD_ID no es opcional en la práctica: sin él, `/guilds/{id}/threads/active` no se llama
# y el bot SÓLO ve threads archivados, así que un reporte recién abierto no entra hasta que Discord
# lo archive.
#
# Los gates (`gate` en projects.json) se resuelven en lib/matrix.mjs, porque un `if:` de job no ve la
# matrix. Un proyecto con el gate cerrado queda en la matrix y su fila dice por qué no corrió.
#
# La cadencia real la pone intake-pacer.yml, no el cron: GitHub encola el `schedule` de un repo
# público según su carga y las corridas llegaban con horas de separación. Al terminar, el job `next`
# deja un pacer en espera (wait timer de 10 min del environment `intake-pacing`), y ese pacer vuelve
# a disparar este workflow con trigger=scheduler. El `schedule` queda como red: si la cadena se
# corta, la próxima corrida que llegue por cron la revive.

run-name: Intake (${{ inputs.trigger || github.event_name }})

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
    inputs:
      trigger:
        description: "manual, o scheduler cuando lo dispara intake-pacer.yml (los gates valen como en un schedule)"
        type: choice
        options: [manual, scheduler]
        default: manual

permissions:
  contents: write

concurrency:
  group: intake
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - id: matrix
        env:
          REPO_VARS: ${{ toJSON(vars) }}
          EVENT_NAME: ${{ github.event_name }}
          TRIGGER: ${{ inputs.trigger }}
        run: node lib/matrix.mjs

  poll:
    needs: plan
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      # Un proyecto roto no cancela a los demás.
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - name: Gate closed
        if: ${{ !matrix.run }}
        env:
          DIR: ${{ matrix.dir }}
          REASON: ${{ matrix.reason }}
        run: |
          echo "Skipped $DIR: $REASON"

      # La punta de la rama, no github.sha: una corrida que esperó en la cola de `concurrency` lleva
      # el SHA de cuando se disparó, de antes de que la anterior pusheara su state.json, y con ese
      # ledger viejo volvería a filar los mismos hilos.
      - uses: actions/checkout@v7
        if: ${{ matrix.run }}
        with:
          ref: ${{ github.ref }}
      - uses: actions/setup-node@v7
        if: ${{ matrix.run }}
        with:
          node-version: "24"

      - name: Poll Discord and file issues
        if: ${{ matrix.run }}
        working-directory: ${{ matrix.dir }}
        env:
          DISCORD_BOT_TOKEN: ${{ secrets[format('{0}_DISCORD_TOKEN', matrix.prefix)] }}
          DISCORD_FORUM_CHANNEL_ID: ${{ vars[format('{0}_TICKETS_CHANNEL_ID', matrix.prefix)] }}
          DISCORD_GUILD_ID: ${{ vars.DISCORD_GUILD_ID }}
          GH_TOKEN: ${{ secrets[format('{0}_GH_TOKEN', matrix.prefix)] }}
          GH_ISSUES_REPO: ${{ vars[format('{0}_GH_REPO', matrix.prefix)] }}
          INTAKE_USER_AGENT: ${{ matrix.ua }}
          SKIP_BEFORE_ID: ${{ matrix.skipBeforeId }}
        run: node ../lib/poller.mjs

      - name: Persist dedup state and credits
        if: ${{ matrix.run }}
        env:
          DIR: ${{ matrix.dir }}
        run: |
          # reporters.json no existe hasta que se fila el primer issue, y `git add` de un path que
          # no existe corta con exit 128. Se agrega lo que haya y se commitea sólo si quedó algo.
          for f in "$DIR/state.json" "$DIR/reporters.json"; do
            if [ -f "$f" ]; then git add "$f"; fi
          done
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -m "chore($DIR): update intake state [skip ci]"
          # Todas las filas de la matrix pushean al mismo branch en el mismo segundo. Un push que
          # pierde la carrera deja el state sin guardar y la corrida siguiente vuelve a filar los
          # mismos issues, así que se reintenta sobre lo que haya entrado. Cada fila toca sólo su
          # carpeta: el rebase no puede chocar.
          for i in 1 2 3 4 5; do
            if git pull --rebase --autostash && git push; then exit 0; fi
            sleep $((i * 3))
          done
          echo "::error::could not push $DIR state after 5 attempts"
          exit 1

  next:
    # Corre falle lo que falle arriba: una fila rota no puede cortar la cadena.
    needs: poll
    if: ${{ always() }}
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Keep one pacer waiting
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          # Una sola cadena: si ya hay un pacer esperando, éste no agrega otro. Sólo cuentan los que
          # todavía no arrancaron; uno in_progress es el que disparó esta corrida, o está a punto de
          # disparar la siguiente, y de las dos corridas que resulten la segunda ya ve el nuevo.
          waiting=""
          for i in 1 2 3 4 5; do
            if waiting=$(gh api "repos/$REPO/actions/workflows/intake-pacer.yml/runs?per_page=20" \
                --jq '[.workflow_runs[] | select(.status == "queued" or .status == "waiting" or .status == "pending" or .status == "requested")] | length'); then
              break
            fi
            waiting=""
            sleep $((i * 5))
          done
          if [ -z "$waiting" ]; then
            echo "::error::could not list intake-pacer runs; the chain stops until the next scheduled run"
            exit 1
          fi
          if [ "$waiting" -gt 0 ]; then
            echo "A pacer is already waiting ($waiting); nothing to do."
            exit 0
          fi
          for i in 1 2 3 4 5; do
            if gh workflow run intake-pacer.yml --repo "$REPO" --ref "$GITHUB_REF_NAME"; then
              echo "Pacer dispatched."
              exit 0
            fi
            sleep $((i * 5))
          done
          echo "::error::could not dispatch intake-pacer; the chain stops until the next scheduled run"
          exit 1
