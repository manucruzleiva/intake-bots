name: Discord server

# El server de Discord como código: server.json lo declara entero y lib/server.mjs hace que el guild
# coincida. En dry run por defecto: la corrida imprime el diff en el job summary y no toca nada hasta
# que se la dispara a mano con dry_run=false. Un cron diario corre sólo el dry run, así la tarjeta
# "Discord server" de la página de estado no queda "Unchecked" si nadie lo dispara en una semana.
#
# Nada que no esté en server.json se borra salvo con prune=true; sin él, lo que sobra sale en el
# diff como "extra" y se deja. Antes de un prune, leé el dry run: borrar un foro borra sus threads.
#
#   Secret:   DISCORD_TOKEN      el bot único del server (Administrator)
#   Variable: DISCORD_GUILD_ID   la misma que usan los pollers

run-name: Discord server (${{ (github.event_name == 'schedule' || inputs.dry_run) && 'dry run' || 'apply' }}${{ inputs.prune && ' + prune' || '' }})

on:
  # Sólo dry run: en un schedule los inputs llegan vacíos y APPLY/PRUNE abajo exigen workflow_dispatch.
  schedule:
    - cron: "17 9 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Only print the diff"
        type: boolean
        default: true
      prune:
        description: "Delete what server.json does not declare"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: discord-server
  cancel-in-progress: false

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Reconcile the guild with server.json
        env:
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
          DISCORD_GUILD_ID: ${{ vars.DISCORD_GUILD_ID }}
          APPLY: ${{ github.event_name == 'workflow_dispatch' && !inputs.dry_run && '--apply' || '' }}
          PRUNE: ${{ github.event_name == 'workflow_dispatch' && inputs.prune && '--prune' || '' }}
        run: node lib/server.mjs $APPLY $PRUNE
