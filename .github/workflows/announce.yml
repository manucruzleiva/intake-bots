name: Announce release

# El anuncio de Discord de un release, para todos los mods: el job `announce` de cada publish.yml lo
# llama con `uses: manucruzleiva/intake-bots/.github/workflows/announce.yml@main`. Antes era un paso
# pegado en siete publish.yml, cada uno con su emoji, sus links y su footer adentro de un `jq`.
#
# Lo propio de cada mod (canal, encabezado, color, footer) vive en el bloque `announce` de
# projects.json, y el formato en lib/announce.mjs.
#
# Adentro de un workflow llamado, `actions/checkout` sin `repository` trae el repo del CALLER: de ahí
# sale su CHANGELOG.md. intake-bots se baja aparte en .intake/, de la misma rama que el `@main` del
# `uses:`. Este repo es público, así que los repos privados de los mods lo pueden llamar.
#
# Cerrar los issues del release NO está acá: se queda en cada publish.yml, que tiene el token de su
# propio repo.

on:
  workflow_call:
    inputs:
      project:
        description: "The project's `dir` in projects.json"
        required: true
        type: string
      version:
        description: "The version being announced, without the leading v"
        required: true
        type: string
    secrets:
      DISCORD_TOKEN:
        # Sin token el anuncio se saltea con un aviso, igual que el paso que reemplaza.
        required: false

permissions:
  contents: read

jobs:
  announce:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/checkout@v7
        with:
          repository: manucruzleiva/intake-bots
          ref: main
          path: .intake

      - uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Announce on Discord
        env:
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
          PROJECT: ${{ inputs.project }}
          VERSION: ${{ inputs.version }}
          # `github.event` es el evento del caller. Un dispatch announce_only no trae release, así que
          # cae a la página de releases del repo.
          RELEASE_URL: ${{ github.event.release.html_url || format('https://github.com/{0}/releases', github.repository) }}
        run: node .intake/lib/announce.mjs "$PROJECT" "$VERSION"
